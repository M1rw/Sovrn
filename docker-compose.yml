# =============================================================================
# SOVRN Docker Compose - Production Configuration
# =============================================================================
# Single-file deployment for affordable VPS (4 vCPU, 8GB RAM)
# All services run offline with no external dependencies
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Caddy - Reverse Proxy & Auto HTTPS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: sovrn-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sovrn-network
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector - Database
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: sovrn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sovrn}
      POSTGRES_USER: ${POSTGRES_USER:-sovrn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sovrn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sovrn} -d ${POSTGRES_DB:-sovrn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # FastAPI Backend - API Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: sovrn-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sovrn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sovrn}
      - INFERENCE_URL=http://infer:8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ARTIFACTS_PATH=/var/artifacts
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - artifacts:/var/artifacts
      - ./services/api:/app:ro
    networks:
      - sovrn-network
    depends_on:
      db:
        condition: service_healthy
      infer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1.5G

  # ---------------------------------------------------------------------------
  # Next.js Frontend - Web Application
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: sovrn-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXTAUTH_URL=${PUBLIC_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
    networks:
      - sovrn-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Hybrid Router (Puter primary + local fallback)
  # ---------------------------------------------------------------------------
  router:
    build:
      context: ./sovrn
      dockerfile: Dockerfile
    container_name: sovrn-router
    restart: unless-stopped
    environment:
      - SOVRN_ROUTER_PORT=7070
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PUTER_API_BASE_URL=${PUTER_API_BASE_URL:-}
      - PUTER_API_KEY=${PUTER_API_KEY:-}
      - PUTER_TIMEOUT_MS=${PUTER_TIMEOUT_MS:-800}
      - PUTER_HEALTH_INTERVAL_MS=${PUTER_HEALTH_INTERVAL_MS:-300000}
    networks:
      - sovrn-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7070/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # llama.cpp Inference Server - AI Engine
  # ---------------------------------------------------------------------------
  infer:
    build:
      context: .
      dockerfile: infra/docker/infer.Dockerfile
    container_name: sovrn-infer
    restart: unless-stopped
    environment:
      - MODEL_PATH=${MODEL_PATH:-/models/phi-3-mini-4bit.gguf}
      - CONTEXT_SIZE=${MODEL_CONTEXT_SIZE:-4096}
      - THREADS=${MODEL_THREADS:-4}
      - GPU_LAYERS=${MODEL_GPU_LAYERS:-0}
    volumes:
      - ./models:/models:ro
    networks:
      - sovrn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 7.5G
          cpus: "2"

  # ---------------------------------------------------------------------------
  # Worker - Background Job Processor
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: sovrn-worker
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sovrn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sovrn}
      - INFERENCE_URL=http://infer:8080
      - ARTIFACTS_PATH=/var/artifacts
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - artifacts:/var/artifacts
      - ./services/worker:/app:ro
    networks:
      - sovrn-network
    depends_on:
      db:
        condition: service_healthy
      infer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis - Caching & Job Queue (Optional)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sovrn-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - sovrn-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  sovrn-network:
    driver: bridge
    internal: false  # Allow outbound only during build, block at firewall level

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  artifacts:
    driver: local
